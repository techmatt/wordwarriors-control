project = "wordwarriors"
locks = []
ports = "5240-5259"   # this project's port block (conductor 119)
open_roots = ["C:/Code/gdrive-sync/wordwarriors"]

[defaults]
max_hours = 2
ask_default_minutes = 10

[repos.wordwarriors]
path = "../wordwarriors"
shared = ["art-originals", "public/voice-gen"]
setup = ["npm ci"]
push = true
background = ["npm test*", "npm run test*", "npx playwright*", "npm run shots*", "npm run perf*", "npm run qa*"]

[run.game]
repo = "wordwarriors"
command = "npm install && npm run dev -- --port 5240 --strictPort"
url = "http://localhost:5240/"
ready_seconds = 180
