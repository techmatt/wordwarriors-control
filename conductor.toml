project = "wordwarriors"
locks = []
open_roots = ["C:/Code/gdrive-sync/wordwarriors"]

[defaults]
max_hours = 2
ask_default_minutes = 10

[repos.wordwarriors]
path = "../wordwarriors"
shared = ["art-originals", "scratch", "public/voice-gen"]
setup = ["npm ci"]
background = ["npm test*", "npm run test*", "npx playwright*", "npm run shots*", "npm run perf*", "npm run qa*"]

[run.game]
repo = "wordwarriors"
command = "npm install && npm run dev -- --port 5174"
url = "http://localhost:5174/"
ready_seconds = 180
